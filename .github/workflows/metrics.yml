name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Hamza-Jawaid
          template: classic
          # Removes all the cluttered lists and zeroes
          base: header
          # This forces the action to calculate Private Commits and add them to the total
          base_indepth: yes 
          config_timezone: Asia/Karachi
          # Adds the 3D isometric calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          # Adds a sleek languages breakdown
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 4
          plugin_languages_details: percentage
