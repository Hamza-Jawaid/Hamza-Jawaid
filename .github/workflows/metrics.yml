name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Generate the Top Header (Name, Joined, Repos)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.header.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header
          base_indepth: yes
          config_timezone: Asia/Karachi

      # Step 2: Generate the Bottom Section (Languages ONLY)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.bottom.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Karachi
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 4
          plugin_languages_details: percentage
