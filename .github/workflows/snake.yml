name: Generate Snake Animation & Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Generate Snake Game (Lowest tier is red, the rest are GitHub green)
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=red&color_dots=#ebedf0,#ff9999,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=red&color_dots=#161b22,#8a1919,#006d32,#26a641,#39d353

      # Step 1.5: Unlock folder permissions for the next action
      - name: Fix directory permissions
        run: sudo chmod -R 777 dist

      # Step 2: Generate Streak Card (with private commits)
      - name: Generate Streak Stats
        uses: be-next/github-streak-stats-action@v1
        with:
          username: Hamza-Jawaid
          token: ${{ secrets.METRICS_TOKEN }}
          theme: tokyonight
          hide-border: true
          output-path: dist/streak-stats.svg

      # Step 3: Push all images to the "output" branch
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
