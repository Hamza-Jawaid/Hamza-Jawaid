<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 738 368" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      :root {
        --bg-color: transparent;
        --card-bg: #ffffff; 
        --text-main: #111827;
        --text-sub: #4b5563;
        --border: #e5e7eb;
        --shadow: rgba(0, 0, 0, 0.05);
        --icon-bg-1: #e0f2fe;
        --icon-bg-2: #f3e8ff;
        --icon-bg-3: #dcfce7;
        --icon-bg-4: #ffedd5;
        --accent-1: #0284c7;
        --accent-2: #9333ea;
        --accent-3: #16a34a;
        --accent-4: #ea580c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1e293b;
          --text-main: #f8fafc;
          --text-sub: #94a3b8;
          --border: #334155;
          --shadow: rgba(0, 0, 0, 0.2);
          --icon-bg-1: rgba(2, 132, 199, 0.2);
          --icon-bg-2: rgba(147, 51, 234, 0.2);
          --icon-bg-3: rgba(22, 163, 74, 0.2);
          --icon-bg-4: rgba(234, 88, 12, 0.2);
          --accent-1: #38bdf8;
          --accent-2: #c084fc;
          --accent-3: #4ade80;
          --accent-4: #fb923c;
        }
      }

      /* Card Backgrounds Base */
      .card-bg {
        fill: var(--card-bg);
        stroke: var(--border);
        stroke-width: 1.5;
        rx: 16;
      }

      /* Smooth Walking Glow Animations */
      .cb-1 { animation: glow-1 8s ease-in-out infinite; }
      .cb-2 { animation: glow-2 8s ease-in-out infinite; }
      .cb-3 { animation: glow-3 8s ease-in-out infinite; }
      .cb-4 { animation: glow-4 8s ease-in-out infinite; }

      /* Card 1: Peaks at 0% */
      @keyframes glow-1 {
        0%, 100% { stroke: var(--accent-1); filter: drop-shadow(0 0 16px var(--accent-1)); stroke-width: 2; }
        25%, 75% { stroke: var(--border); filter: drop-shadow(0 4px 6px var(--shadow)); stroke-width: 1.5; }
      }
      
      /* Card 2: Peaks at 25% */
      @keyframes glow-2 {
        0%, 50%, 100% { stroke: var(--border); filter: drop-shadow(0 4px 6px var(--shadow)); stroke-width: 1.5; }
        25% { stroke: var(--accent-2); filter: drop-shadow(0 0 16px var(--accent-2)); stroke-width: 2; }
      }
      
      /* Card 3: Peaks at 50% */
      @keyframes glow-3 {
        0%, 25%, 75%, 100% { stroke: var(--border); filter: drop-shadow(0 4px 6px var(--shadow)); stroke-width: 1.5; }
        50% { stroke: var(--accent-3); filter: drop-shadow(0 0 16px var(--accent-3)); stroke-width: 2; }
      }
      
      /* Card 4: Peaks at 75% */
      @keyframes glow-4 {
        0%, 50%, 100% { stroke: var(--border); filter: drop-shadow(0 4px 6px var(--shadow)); stroke-width: 1.5; }
        75% { stroke: var(--accent-4); filter: drop-shadow(0 0 16px var(--accent-4)); stroke-width: 2; }
      }

      /* Content Layout */
      .content-wrapper {
        font-family: 'Inter', system-ui, sans-serif;
        padding: 24px; /* Restored from 5px to give internal text breathing room */
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .icon-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
      }

      .ib-1 { background-color: var(--icon-bg-1); }
      .ib-2 { background-color: var(--icon-bg-2); }
      .ib-3 { background-color: var(--icon-bg-3); }
      .ib-4 { background-color: var(--icon-bg-4); }

      .card-title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: var(--text-main);
        letter-spacing: -0.01em;
      }

      .card-desc {
        margin: 0;
        font-size: 14.5px;
        line-height: 1.6;
        color: var(--text-sub);
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Card 1: SEO (Top Left) -->
  <g class="card-group">
    <!-- Adjusted coordinates for tighter layout -->
    <rect class="card-bg cb-1" x="16" y="16" width="345" height="160" />
    <foreignObject x="16" y="16" width="345" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" class="content-wrapper">
        <div class="header">
          <div class="icon-box ib-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>
          <h3 class="card-title">SEO</h3>
        </div>
        <p class="card-desc">Technical SEO, on-page optimization, content strategy, search visibility, and website performance.</p>
      </div>
    </foreignObject>
  </g>

  <!-- Card 2: Development (Top Right) -->
  <g class="card-group">
    <rect class="card-bg cb-2" x="377" y="16" width="345" height="160" />
    <foreignObject x="377" y="16" width="345" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" class="content-wrapper">
        <div class="header">
          <div class="icon-box ib-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          </div>
          <h3 class="card-title">Development</h3>
        </div>
        <p class="card-desc">Building websites, web applications, tools, and custom solutions while expanding my development skills.</p>
      </div>
    </foreignObject>
  </g>

  <!-- Card 3: E-commerce (Bottom Left) -->
  <g class="card-group">
    <rect class="card-bg cb-3" x="16" y="192" width="345" height="160" />
    <foreignObject x="16" y="192" width="345" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" class="content-wrapper">
        <div class="header">
          <div class="icon-box ib-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          </div>
          <h3 class="card-title">E-commerce</h3>
        </div>
        <p class="card-desc">Exploring online businesses, product systems, e-commerce experiences, and digital products.</p>
      </div>
    </foreignObject>
  </g>

  <!-- Card 4: Automation (Bottom Right) -->
  <g class="card-group">
    <rect class="card-bg cb-4" x="377" y="192" width="345" height="160" />
    <foreignObject x="377" y="192" width="345" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" class="content-wrapper">
        <div class="header">
          <div class="icon-box ib-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </div>
          <h3 class="card-title">Automation</h3>
        </div>
        <p class="card-desc">Creating bots, workflows, integrations, and tools that make repetitive work simpler.</p>
      </div>
    </foreignObject>
  </g>
</svg>
