<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      :root {
        --bg-color: transparent;
        /* Adjusted slightly off-white in light mode to make the pure white shine visible */
        --card-bg: #f8fafc; 
        --text-main: #111827;
        --text-sub: #4b5563;
        --border: #e5e7eb;
        --shadow: rgba(0, 0, 0, 0.05);
        --icon-bg-1: #e0f2fe;
        --icon-bg-2: #f3e8ff;
        --icon-bg-3: #dcfce7;
        --icon-bg-4: #ffedd5;
        --accent-1: #0284c7;
        --accent-2: #9333ea;
        --accent-3: #16a34a;
        --accent-4: #ea580c;
        
        /* Shine Colors */
        --shine-edge: transparent;
        --shine-center: rgba(255, 255, 255, 1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #1e293b;
          --text-main: #f8fafc;
          --text-sub: #94a3b8;
          --border: #334155;
          --shadow: rgba(0, 0, 0, 0.2);
          --icon-bg-1: rgba(2, 132, 199, 0.2);
          --icon-bg-2: rgba(147, 51, 234, 0.2);
          --icon-bg-3: rgba(22, 163, 74, 0.2);
          --icon-bg-4: rgba(234, 88, 12, 0.2);
          --accent-1: #38bdf8;
          --accent-2: #c084fc;
          --accent-3: #4ade80;
          --accent-4: #fb923c;
          
          /* Subtle shine for dark mode */
          --shine-center: rgba(255, 255, 255, 0.12);
        }
      }

      /* Styles for the main header */
      .main-header {
        cursor: default;
        transition: transform 0.3s ease;
      }
      .main-header:hover {
        transform: translateY(-2px);
      }
      .title-text {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 700;
        font-size: 46px;
        fill: #ffffff;
        filter: drop-shadow(0px 2px 1px rgba(0, 0, 0, 0.75)); 
        transition: filter 0.3s ease;
      }
      .main-header:hover .title-text {
        filter: drop-shadow(0px 3px 2px rgba(0, 0, 0, 0.9));
      }

      /* Card Backgrounds */
      .card-bg {
        fill: var(--card-bg);
        stroke: var(--border);
        stroke-width: 1.5;
        rx: 16;
        filter: drop-shadow(0 4px 6px var(--shadow));
      }

      /* Content Layout */
      .content-wrapper {
        font-family: 'Inter', system-ui, sans-serif;
        padding: 24px;
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .icon-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
      }

      .ib-1 { background-color: var(--icon-bg-1); }
      .ib-2 { background-color: var(--icon-bg-2); }
      .ib-3 { background-color: var(--icon-bg-3); }
      .ib-4 { background-color: var(--icon-bg-4); }

      .card-title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: var(--text-main);
        letter-spacing: -0.01em;
      }

      .card-desc {
        margin: 0;
        font-size: 14.5px;
        line-height: 1.6;
        color: var(--text-sub);
        font-weight: 400;
      }

      /* Glass Shine Effect Classes */
      .shine-edge { stop-color: var(--shine-edge); }
      .shine-center { stop-color: var(--shine-center); }
      .shine-overlay {
        fill: url(#shineGradient);
        rx: 16;
        pointer-events: none; /* Prevents blocking text selection */
      }
    </style>

    <!-- Moving Glass Shine Gradient (Sweeps left to right) -->
    <linearGradient id="shineGradient" gradientUnits="objectBoundingBox" x1="-100%" y1="0%" x2="0%" y2="0%" gradientTransform="rotate(35 0.5 0.5)">
      <stop offset="35%" class="shine-edge" />
      <stop offset="50%" class="shine-center" />
      <stop offset="65%" class="shine-edge" />
      
      <!-- KeyTimes set to create a pause: sweeps for 2.4s, pauses for 3.6s (6s total loop) -->
      <animate attributeName="x1" values="-200%; 300%; 300%" keyTimes="0; 0.4; 1" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="-100%; 400%; 400%" keyTimes="0; 0.4; 1" dur="6s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <!-- Title Area -->
  <g class="main-header">
      <text x="400" y="50" class="title-text" text-anchor="middle" dy=".3em">🧭 What I Do</text>
  </g>

  <!-- Card 1: SEO -->
  <g class="card-group">
    <!-- Solid base background -->
    <rect class="card-bg" x="40" y="90" width="345" height="160" />
    <!-- Glass shine overlay positioned over the background -->
    <rect class="shine-overlay" x="40" y="90" width="345" height="160" rx="16" />
    <!-- Content -->
    <foreignObject x="40" y="90" width="345" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" class="content-wrapper">
        <div class="header">
          <div class="icon-box ib-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>
          <h3 class="card-title">SEO</h3>
        </div>
        <p class="card-desc">Technical SEO, on-page optimization, content strategy, search visibility, and website performance.</p>
      </div>
    </foreignObject>
  </g>

  <!-- Card 2: Development -->
  <g class="card-group">
    <rect class="card-bg" x="415" y="90" width="345" height="160" />
    <rect class="shine-overlay" x="415" y="90" width="345" height="160" rx="16" />
    <foreignObject x="415" y="90" width="345" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" class="content-wrapper">
        <div class="header">
          <div class="icon-box ib-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          </div>
          <h3 class="card-title">Development</h3>
        </div>
        <p class="card-desc">Building websites, web applications, tools, and custom solutions while expanding my development skills.</p>
      </div>
    </foreignObject>
  </g>

  <!-- Card 3: E-commerce -->
  <g class="card-group">
    <rect class="card-bg" x="40" y="275" width="345" height="160" />
    <rect class="shine-overlay" x="40" y="275" width="345" height="160" rx="16" />
    <foreignObject x="40" y="275" width="345" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" class="content-wrapper">
        <div class="header">
          <div class="icon-box ib-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          </div>
          <h3 class="card-title">E-commerce</h3>
        </div>
        <p class="card-desc">Exploring online businesses, product systems, e-commerce experiences, and digital products.</p>
      </div>
    </foreignObject>
  </g>

  <!-- Card 4: Automation -->
  <g class="card-group">
    <rect class="card-bg" x="415" y="275" width="345" height="160" />
    <rect class="shine-overlay" x="415" y="275" width="345" height="160" rx="16" />
    <foreignObject x="415" y="275" width="345" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" class="content-wrapper">
        <div class="header">
          <div class="icon-box ib-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </div>
          <h3 class="card-title">Automation</h3>
        </div>
        <p class="card-desc">Creating bots, workflows, integrations, and tools that make repetitive work simpler.</p>
      </div>
    </foreignObject>
  </g>
</svg>
