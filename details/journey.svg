<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400">
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#020617"/>
    <stop offset="0.5" stop-color="#061326"/>
    <stop offset="1" stop-color="#020409"/>
  </linearGradient>
  <radialGradient id="earth">
    <stop stop-color="#1e88ff"/>
    <stop offset="1" stop-color="#03182d"/>
  </radialGradient>
  <filter id="soft">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
</defs>

<rect width="1200" height="1400" fill="url(#bg)"/>

<!-- ambient lights -->
<circle cx="900" cy="650" r="300" fill="#0066ff" opacity=".12" filter="url(#soft)">
 <animate attributeName="opacity" values=".08;.2;.08" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- Header -->
<text x="60" y="90" fill="#f0883e" font-size="58" font-family="Arial" font-weight="700">SEO</text>
<text x="210" y="90" fill="#fff" font-size="58">→</text>
<text x="290" y="90" fill="#2f81f7" font-size="58" font-family="Arial" font-weight="700">Development</text>
<text x="670" y="90" fill="#fff" font-size="58">→</text>
<text x="750" y="90" fill="#00d084" font-size="52" font-family="Arial" font-weight="700">Building &amp; Learning</text>

<text x="600" y="150" text-anchor="middle" fill="#8b949e" font-size="20" letter-spacing="8">
SEARCH • CODE • BUILD • LEARN • IMPROVE
</text>

<!-- Journey cards -->
<g font-family="Arial">
<rect x="50" y="220" width="310" height="150" rx="25" fill="#0b1628" stroke="#f0883e"/>
<circle cx="115" cy="295" r="38" fill="none" stroke="#f0883e" stroke-width="5">
<animate attributeName="r" values="38;45;38" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="175" y="280" fill="#f0883e" font-size="28" font-weight="700">SEO</text>
<text x="175" y="315" fill="#c9d1d9" font-size="20">Get discovered</text>
<text x="175" y="340" fill="#c9d1d9" font-size="20">Drive growth</text>

<rect x="445" y="220" width="310" height="150" rx="25" fill="#0b1628" stroke="#2f81f7"/>
<circle cx="510" cy="295" r="38" fill="none" stroke="#2f81f7" stroke-width="5">
<animate attributeName="r" values="38;45;38" dur="2.4s" repeatCount="indefinite"/>
</circle>
<text x="570" y="280" fill="#2f81f7" font-size="28" font-weight="700">Development</text>
<text x="570" y="315" fill="#c9d1d9" font-size="20">Build websites</text>
<text x="570" y="340" fill="#c9d1d9" font-size="20">Create solutions</text>

<rect x="840" y="220" width="310" height="150" rx="25" fill="#0b1628" stroke="#00d084"/>
<circle cx="905" cy="295" r="38" fill="none" stroke="#00d084" stroke-width="5">
<animate attributeName="r" values="38;45;38" dur="2.8s" repeatCount="indefinite"/>
</circle>
<text x="965" y="280" fill="#00d084" font-size="25" font-weight="700">Building</text>
<text x="965" y="315" fill="#c9d1d9" font-size="20">Turn ideas</text>
<text x="965" y="340" fill="#c9d1d9" font-size="20">into projects</text>
</g>

<!-- bio -->
<g font-family="Arial" fill="#c9d1d9" font-size="27">
<text x="60" y="460">I'm a digital professional from <tspan font-weight="bold">planet Earth</tspan>,</text>
<text x="60" y="505">with a background in SEO, digital marketing,</text>
<text x="60" y="550">web technologies, and e-commerce.</text>
</g>

<!-- Earth scene -->
<circle cx="850" cy="790" r="240" fill="url(#earth)">
<animate attributeName="opacity" values=".8;1;.8" dur="4s" repeatCount="indefinite"/>
</circle>

<circle cx="850" cy="790" r="280" fill="none" stroke="#2f81f7" stroke-width="2" stroke-dasharray="8 20">
<animateTransform attributeName="transform" type="rotate" from="0 850 790" to="360 850 790" dur="18s" repeatCount="indefinite"/>
</circle>

<!-- orbit icons -->
<g font-family="Arial" font-size="45">
<text x="680" y="560" fill="#00d084">WP</text>
<text x="1020" y="600" fill="#a371f7">GH</text>
<text x="1080" y="820" fill="#2f81f7">&lt;/&gt;</text>
</g>

<!-- Terminal -->
<rect x="60" y="720" width="540" height="330" rx="25" fill="#010409" stroke="#00d084" stroke-width="3"/>
<text x="100" y="790" fill="#00d084" font-size="28" font-family="monospace">$ whoami</text>
<text x="100" y="850" fill="#fff" font-size="25" font-family="monospace">I learn by building.</text>
<text x="100" y="900" fill="#fff" font-size="25" font-family="monospace">I build by experimenting.</text>
<text x="100" y="950" fill="#fff" font-size="25" font-family="monospace">And I keep improving.</text>
<rect x="330" y="980" width="14" height="28" fill="#00d084">
<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>

<!-- bottom journey -->
<g font-family="Arial" text-anchor="middle">
<text x="170" y="1180" fill="#00d084" font-size="55">✦</text>
<text x="170" y="1230" fill="#fff" font-size="28">Explore</text>

<text x="440" y="1180" fill="#2f81f7" font-size="55">⚙</text>
<text x="440" y="1230" fill="#fff" font-size="28">Build</text>

<text x="710" y="1180" fill="#f0883e" font-size="55">↗</text>
<text x="710" y="1230" fill="#fff" font-size="28">Learn</text>

<text x="980" y="1180" fill="#00d084" font-size="55">∞</text>
<text x="980" y="1230" fill="#fff" font-size="28">Repeat</text>
</g>

</svg>
