<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="100%" height="100%" style="background-color: #020617;">
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#020617"/>
    <stop offset="0.5" stop-color="#061326"/>
    <stop offset="1" stop-color="#020409"/>
  </linearGradient>
  <radialGradient id="earth">
    <stop stop-color="#1e88ff"/>
    <stop offset="1" stop-color="#03182d"/>
  </radialGradient>
  <filter id="soft">
    <feGaussianBlur stdDeviation="15"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
    <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background completely covers area -->
<rect width="100%" height="100%" fill="url(#bg)"/>

<!-- Ambient lights -->
<circle cx="1050" cy="650" r="350" fill="#0066ff" opacity=".1" filter="url(#soft)">
 <animate attributeName="opacity" values=".06;.15;.06" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- Header (Shifted Left for Perfect Centering) -->
<g font-family="system-ui, -apple-system, sans-serif">
  <text x="120" y="100" fill="#f0883e" font-size="58" font-weight="800">SEO</text>
  <text x="280" y="100" fill="#4b5563" font-size="58">→</text>
  <text x="390" y="100" fill="#2f81f7" font-size="58" font-weight="800">Development</text>
  <text x="800" y="100" fill="#4b5563" font-size="58">→</text>
  <text x="910" y="100" fill="#00d084" font-size="54" font-weight="800">Building &amp; Learning</text>

  <text x="700" y="160" text-anchor="middle" fill="#8b949e" font-size="20" font-weight="600" letter-spacing="10">
  SEARCH • CODE • BUILD • LEARN • IMPROVE
  </text>
</g>

<!-- Journey cards -->
<g font-family="system-ui, -apple-system, sans-serif">
  <!-- Card 1: SEO -->
  <rect x="50" y="220" width="380" height="160" rx="25" fill="#0b1628" stroke="#f0883e" stroke-width="2"/>
  <g transform="translate(130, 300)">
    <circle cx="0" cy="0" r="42" fill="#112240" stroke="#f0883e" stroke-width="2">
      <animate attributeName="r" values="42;48;42" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="34" fill="#061326" />
    <!-- Modern SEO Icon -->
    <g fill="none" stroke="#f0883e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-16, -16) scale(1.3)">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      <polyline points="7 12 10 9 13 12 16 7"></polyline>
    </g>
  </g>
  <text x="210" y="275" fill="#f0883e" font-size="28" font-weight="800">SEO</text>
  <text x="210" y="310" fill="#c9d1d9" font-size="20">Get discovered</text>
  <text x="210" y="335" fill="#c9d1d9" font-size="20">Drive growth</text>

  <!-- Card 2: Development -->
  <rect x="510" y="220" width="380" height="160" rx="25" fill="#0b1628" stroke="#2f81f7" stroke-width="2"/>
  <g transform="translate(590, 300)">
    <circle cx="0" cy="0" r="42" fill="#112240" stroke="#2f81f7" stroke-width="2">
      <animate attributeName="r" values="42;48;42" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="34" fill="#061326" />
    <!-- Modern Code Icon -->
    <g fill="none" stroke="#2f81f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-16, -16) scale(1.3)">
      <polyline points="16 18 22 12 16 6"></polyline>
      <polyline points="8 6 2 12 8 18"></polyline>
    </g>
  </g>
  <text x="670" y="275" fill="#2f81f7" font-size="28" font-weight="800">Development</text>
  <text x="670" y="310" fill="#c9d1d9" font-size="20">Build websites</text>
  <text x="670" y="335" fill="#c9d1d9" font-size="20">Create solutions</text>

  <!-- Card 3: Building -->
  <rect x="970" y="220" width="380" height="160" rx="25" fill="#0b1628" stroke="#00d084" stroke-width="2"/>
  <g transform="translate(1050, 300)">
    <circle cx="0" cy="0" r="42" fill="#112240" stroke="#00d084" stroke-width="2">
      <animate attributeName="r" values="42;48;42" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1;0;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="34" fill="#061326" />
    <!-- Modern Build/Blocks Icon -->
    <g fill="none" stroke="#00d084" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-16, -16) scale(1.3)">
      <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
      <polyline points="2 17 12 22 22 17"></polyline>
      <polyline points="2 12 12 17 22 12"></polyline>
    </g>
  </g>
  <text x="1130" y="275" fill="#00d084" font-size="28" font-weight="800">Building</text>
  <text x="1130" y="310" fill="#c9d1d9" font-size="20">Turn ideas</text>
  <text x="1130" y="335" fill="#c9d1d9" font-size="20">into projects</text>
</g>

<!-- Bio -->
<g font-family="system-ui, -apple-system, sans-serif" fill="#c9d1d9" font-size="28" font-weight="300">
  <text x="80" y="500">I'm a digital professional from <tspan fill="#2f81f7" font-weight="700">planet Earth</tspan>,</text>
  <text x="80" y="550">with a background in SEO, digital marketing,</text>
  <text x="80" y="600">web technologies, and e-commerce.</text>
</g>

<!-- Earth scene -->
<circle cx="1050" cy="850" r="260" fill="url(#earth)">
  <animate attributeName="opacity" values=".8;1;.8" dur="4s" repeatCount="indefinite"/>
</circle>

<circle cx="1050" cy="850" r="330" fill="none" stroke="#2f81f7" stroke-width="2" stroke-dasharray="8 20">
  <animateTransform attributeName="transform" type="rotate" from="0 1050 850" to="360 1050 850" dur="25s" repeatCount="indefinite"/>
</circle>

<!-- Orbit Nodes (Animated Badges) -->
<!-- 1. WordPress (Top Left) -->
<g transform="translate(816, 616)">
  <animateTransform attributeName="transform" type="translate" values="816,616; 816,604; 816,616" dur="4s" repeatCount="indefinite" />
  <rect x="-35" y="-35" width="70" height="70" rx="18" fill="#061326" stroke="#00d084" stroke-width="3" filter="url(#glow)"/>
  <path transform="translate(-18, -18) scale(1.5)" fill="#00d084" d="M12 2C6.48 2 2 6.48 2 12c0 3.31 1.61 6.24 4.09 8.06l-3.23-8.85c-.56 1.46-.86 3.06-.86 4.75 0 4.54 3.01 8.38 7.18 9.61L12 2zm1.65 14.73l-2.08-6.17h2.24l-2.08 6.17zm4.24-4.88c0 1.25-.33 2.5-.94 3.55l-4.13-11.83h3.58l3.66 10.15c.66-1.12 1.05-2.45 1.05-3.87 0-1.63-.5-3.15-1.35-4.43l-1.87 6.43z"/>
</g>

<!-- 2. GitHub (Top Right) -->
<g transform="translate(1284, 616)">
  <animateTransform attributeName="transform" type="translate" values="1284,616; 1284,606; 1284,616" dur="5s" repeatCount="indefinite" />
  <rect x="-35" y="-35" width="70" height="70" rx="18" fill="#061326" stroke="#a371f7" stroke-width="3" filter="url(#glow)"/>
  <path transform="translate(-16, -16) scale(1.33)" fill="#a371f7" d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.45-1.15-1.11-1.46-1.11-1.46-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0012 2z"/>
</g>

<!-- 3. Code (Bottom Left) -->
<g transform="translate(816, 1084)">
  <animateTransform attributeName="transform" type="translate" values="816,1084; 816,1072; 816,1084" dur="4.5s" repeatCount="indefinite" />
  <rect x="-35" y="-35" width="70" height="70" rx="18" fill="#061326" stroke="#2f81f7" stroke-width="3" filter="url(#glow)"/>
  <g fill="none" stroke="#2f81f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-18, -18) scale(1.5)">
    <polyline points="16 18 22 12 16 6"></polyline>
    <polyline points="8 6 2 12 8 18"></polyline>
  </g>
</g>

<!-- 4. Cloud/Database (Bottom Right) -->
<g transform="translate(1284, 1084)">
  <animateTransform attributeName="transform" type="translate" values="1284,1084; 1284,1074; 1284,1084" dur="3.5s" repeatCount="indefinite" />
  <rect x="-35" y="-35" width="70" height="70" rx="18" fill="#061326" stroke="#f0883e" stroke-width="3" filter="url(#glow)"/>
  <g fill="none" stroke="#f0883e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-18, -18) scale(1.5)">
    <path d="M19 18H6c-2.76 0-5-2.24-5-5s2.24-5 5-5c.42-3.38 3.32-6 6.81-6 3.19 0 5.86 2.14 6.64 5.09C21.64 7.39 23 9.04 23 11c0 2.2-1.78 4-3.98 4-1.02 0-2.02-.45-2.72-1.22"/>
  </g>
</g>

<!-- Terminal -->
<rect x="80" y="730" width="600" height="350" rx="25" fill="#010409" stroke="#00d084" stroke-width="3"/>
<circle cx="115" cy="765" r="8" fill="#ff5f56"/>
<circle cx="140" cy="765" r="8" fill="#ffbd2e"/>
<circle cx="165" cy="765" r="8" fill="#27c93f"/>

<text x="110" y="830" fill="#00d084" font-size="28" font-family="monospace">$ whoami</text>
<text x="110" y="890" fill="#fff" font-size="26" font-family="monospace">I learn by building.</text>
<text x="110" y="945" fill="#fff" font-size="26" font-family="monospace">I build by experimenting.</text>
<text x="110" y="1000" fill="#fff" font-size="26" font-family="monospace">And I keep improving.</text>
<!-- Cursor Position Fixed -> Accurately pushed right to clear text -->
<rect x="445" y="976" width="14" height="28" fill="#00d084">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>

<!-- Bottom Journey -->
<g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
  
  <!-- 1. Explore (Compass) - Increased gap by shifting icons up to -100 -->
  <g transform="translate(175, 1260)">
    <g fill="none" stroke="#00d084" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-30, -100) scale(2.5)">
      <circle cx="12" cy="12" r="10"></circle>
      <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
    </g>
    <text y="0" fill="#fff" font-size="28" font-weight="700">Explore</text>
  </g>

  <!-- 2. Build (Settings/Gears) -->
  <g transform="translate(525, 1260)">
    <g fill="none" stroke="#2f81f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-30, -100) scale(2.5)">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path>
    </g>
    <text y="0" fill="#fff" font-size="28" font-weight="700">Build</text>
  </g>

  <!-- 3. Learn (Lightbulb) -->
  <g transform="translate(875, 1260)">
    <g fill="none" stroke="#f0883e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-30, -100) scale(2.5)">
      <path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0012 3a4.65 4.65 0 00-4.5 8.5c.76.76 1.23 1.52 1.41 2.5"></path>
    </g>
    <text y="0" fill="#fff" font-size="28" font-weight="700">Learn</text>
  </g>

  <!-- 4. Repeat (Refresh Infinity) -->
  <g transform="translate(1225, 1260)">
    <g fill="none" stroke="#a371f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-30, -100) scale(2.5)">
      <path d="M21 2v6h-6"></path>
      <path d="M3 12a9 9 0 0115-6.7L21 8"></path>
      <path d="M3 22v-6h6"></path>
      <path d="M21 12a9 9 0 01-15 6.7L3 16"></path>
    </g>
    <text y="0" fill="#fff" font-size="28" font-weight="700">Repeat</text>
  </g>

</g>

</svg>
