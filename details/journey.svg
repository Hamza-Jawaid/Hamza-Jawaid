<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400">
<defs>
<linearGradient id="bg" x2="0" y2="1">
<stop stop-color="#0d1117"/>
<stop offset="1" stop-color="#010409"/>
</linearGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="6"/>
</filter>
</defs>

<rect width="1200" height="1400" fill="url(#bg)"/>

<!-- Header -->
<text x="60" y="100" fill="#f0883e" font-size="54" font-family="Arial" font-weight="700">SEO</text>
<text x="210" y="100" fill="#fff" font-size="54" font-family="Arial">→</text>
<text x="300" y="100" fill="#2f81f7" font-size="54" font-family="Arial" font-weight="700">Development</text>
<text x="650" y="100" fill="#fff" font-size="54" font-family="Arial">→</text>
<text x="730" y="100" fill="#3fb950" font-size="54" font-family="Arial" font-weight="700">Building &amp; Learning</text>

<!-- Journey -->
<line x1="160" y1="260" x2="1040" y2="260" stroke="#30363d" stroke-width="5"/>
<line x1="160" y1="260" x2="1040" y2="260" stroke="#58a6ff" stroke-width="5" stroke-dasharray="40 200">
<animate attributeName="stroke-dashoffset" from="0" to="-240" dur="3s" repeatCount="indefinite"/>
</line>

<circle cx="200" cy="260" r="55" fill="#111827" stroke="#f0883e" stroke-width="5">
<animate attributeName="r" values="55;65;55" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="155" y="270" fill="#f0883e" font-size="25" font-family="Arial">SEO</text>

<circle cx="600" cy="260" r="55" fill="#111827" stroke="#2f81f7" stroke-width="5">
<animate attributeName="r" values="55;65;55" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="550" y="270" fill="#2f81f7" font-size="22" font-family="Arial">CODE</text>

<circle cx="1000" cy="260" r="55" fill="#111827" stroke="#3fb950" stroke-width="5">
<animate attributeName="r" values="55;65;55" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="950" y="270" fill="#3fb950" font-size="22" font-family="Arial">BUILD</text>

<!-- Bio -->
<text x="70" y="420" fill="#c9d1d9" font-size="30" font-family="Arial">
I'm a digital professional from planet Earth,
</text>
<text x="70" y="465" fill="#c9d1d9" font-size="30" font-family="Arial">
working across SEO, development, automation,
</text>
<text x="70" y="510" fill="#c9d1d9" font-size="30" font-family="Arial">
web technologies and e-commerce.
</text>

<!-- Earth -->
<circle cx="850" cy="720" r="220" fill="#062b55" stroke="#2f81f7" stroke-width="4">
<animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="850" cy="720" r="250" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="15 20">
<animateTransform attributeName="transform" type="rotate" from="0 850 720" to="360 850 720" dur="20s" repeatCount="indefinite"/>
</circle>

<text x="720" y="720" fill="#58a6ff" font-size="60" font-family="Arial">&lt;/&gt;</text>

<!-- Terminal -->
<rect x="70" y="680" width="520" height="300" rx="20" fill="#010409" stroke="#3fb950" stroke-width="3"/>
<text x="110" y="770" fill="#3fb950" font-size="30" font-family="monospace">$ whoami</text>
<text x="110" y="830" fill="#c9d1d9" font-size="27" font-family="monospace">I learn by building.</text>
<text x="110" y="880" fill="#c9d1d9" font-size="27" font-family="monospace">I build by experimenting.</text>
<text x="110" y="930" fill="#c9d1d9" font-size="27" font-family="monospace">And I keep improving.</text>

<!-- Bottom -->
<text x="180" y="1150" fill="#3fb950" font-size="45">+</text>
<text x="180" y="1200" fill="#c9d1d9" font-size="28" font-family="Arial">Explore</text>

<text x="450" y="1150" fill="#2f81f7" font-size="45">⚙</text>
<text x="450" y="1200" fill="#c9d1d9" font-size="28" font-family="Arial">Build</text>

<text x="720" y="1150" fill="#f0883e" font-size="45">↗</text>
<text x="720" y="1200" fill="#c9d1d9" font-size="28" font-family="Arial">Learn</text>

<text x="990" y="1150" fill="#3fb950" font-size="45">∞</text>
<text x="990" y="1200" fill="#c9d1d9" font-size="28" font-family="Arial">Repeat</text>

<text x="600" y="1330" text-anchor="middle" fill="#58a6ff" font-size="30" font-family="Arial">
I learn by building. I build by experimenting. And I keep improving.
</text>

</svg>
